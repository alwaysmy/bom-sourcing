      - {mpn: "HGC0805R5106K250NSLJ", brand: "Chinocera(华瓷)", code: "C19103847", spec: "0805 10uF ±10% 25V X5R", note: "国产低价替代"}
      - {mpn: "CSA0603X7R104K500JT", brand: "HRE(芯声)", code: "C3012381", spec: "0603 100nF ±10% 50V X7R", note: "0.1uF 主力去耦料"}
      - {mpn: "FCC0603B104K500CT", brand: "FOJAN(富捷)", code: "C5137636", spec: "0603 100nF ±10% 50V X7R", note: "0.1uF 低价位"}
    risk_notes:
