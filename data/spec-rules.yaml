  capacitor_electrolytic:
    display: 铝电解电容
    lcsc_category: [贴片铝电解电容, 直插铝电解电容]
    mall_params_observed: [容值, 精度, 额定电压, 纹波电流]
    mall_filter_extra: [封装/尺寸, 品牌, 工作温度, 寿命]
    required_to_specify: [capacitance, voltage_rating, ripple_current, esr, size]
    substitute_equivalence: "容值 + 耐压>= + 尺寸可装 + 纹波电流>=原值 = 可替换（需查寿命）"
    critical:
      - key: capacitance
        unit: F
        cmp: gte
        conf: S
        note: "滤波场合容值可放大（-20% 以内可接受，不可大幅减小）"
      - key: voltage_rating
        unit: V
        cmp: gte_margin
        margin: 1.5
        conf: E
        note: "含纹波峰值；高温环境建议 1.5~2x"
      - key: ripple_current
        unit: A
        cmp: gte_margin
        margin: 1.5
        conf: E
        note: "纹波电流不达标=发热=寿命骤降；这是最常被忽略的替代失效点"
      - key: size
        unit: mm
        cmp: enum_compatible
        conf: S
        note: "直径/高度/引脚间距必须能装（插件尤其严格）"
      - key: esr
        unit: ohm
        cmp: lte
        conf: D
        note: "开关电源场合 ESR 必须不劣于原值（低频滤波可放宽）"
    conditional_critical:
      - when: "开关电源输出滤波 / 大纹波场合"
        keys: [ripple_current, esr, 寿命]
        tighten: "必须低 ESR 系列（固态/低阻），普通品会过热鼓包"
        conf: E
      - when: "高温环境或长寿命要求"
        keys: [寿命, 工作温度]
        tighten: "选 105℃/5000h 以上；寿命按 10℃2 倍定律折算"
        conf: S
    relaxable:
      - {key: brand, note: "国产 vs 日系价差 1.3~3x；国产常规品用于非关键位足够"}
      - {key: tolerance, note: "±20% 是常态，不必苛求"}
      - {key: 尺寸, note: "板上空间允许时可用更大尺寸换更长寿命（便宜且更耐用）"}
    upgrade_rules:
      - {id: e_life_up, when: "长期高温工作", do: "105℃ -> 125℃ 或 2000h -> 5000h 系列", cost: "料价 1.2~2x"}
      - {id: e_esr_up, when: "纹波大/发热", do: "普通品 -> 低 ESR / 固态聚合物", cost: "2~5x"}
      - {id: e_cap_up, when: "容值余量不足", do: "升一档容值或并联", cost: "空间"}
    forbid_rules:
      - "极性绝对不可反（反接=爆浆），替代时确认封装极性标记一致"
      - "严禁用普通 85℃ 品替代 105℃ 品用于电源输出"
      - "严禁用低纹波电流品替代，即使容值耐压都够（会过热失效）"
      - "禁止替代时忽略安装高度（贴片电解高体在屏蔽罩下会顶壳）"
    price_band:
      ref: "100uF/25V 贴片/插件常规"
      tiers_rmb: [{qty: 10, price: 0.2228}, {qty: 100, price: 0.1822}, {qty: 1000, price: 0.132088}]
      note: "纹波 88mA@120Hz；大容值/低 ESR/高温型价格显著上浮"
      conf: M
    default_parts:
      - {mpn: "RST100UF25V004", brand: "KNSCHA(科尼盛)", code: "C4747964", spec: "100uF ±20% 25V 纹波88mA@120Hz", note: "常规滤波用"}
      - {mpn: "JVJ25V100M6x5", brand: "JIERR(捷而瑞)", code: "C46550402", spec: "100uF ±20% 25V 6x5mm", note: "同规格备选"}
    risk_notes:
      - "翻新：拆机电解电容重新套皮/打字最常见（外观全新但已老化）。识别：引脚有焊锡残留、套管字迹模糊/歪斜、批次号与日期矛盾"
      - "假低 ESR：标称低阻实为普通品，电源上会鼓包。关键位要求提供 datasheet 与系列料号"
      - "容量虚标：小体积标高容值，实测容值常不足 60%"
      - "寿命陷阱：85℃ 1000h 品在 45℃ 环境折算约 16000h（约 2 年），长期产品必须按 10℃2 倍定律算够"

  capacitor_tantalum:
    display: 钽电容（含聚合物钽）
    lcsc_category: [钽电容]
    mall_params_observed: [容值, 精度, 额定电压, 等效串联电阻(ESR)]
    mall_filter_extra: [封装(CASE-A/B/C/D), 品牌]
    required_to_specify: [capacitance, voltage_rating, esr, case_size]
    substitute_equivalence: "容值 + 耐压 + CASE 尺寸相同 + ESR 不劣 = 可替换"
    critical:
      - key: voltage_rating
        unit: V
        cmp: gte_margin
        margin: 2.5
        conf: S
        note: |
          钽电容必须 2.5x 以上降额（业界常规要求 50% 电压降额，浪涌场合更低）。
          失效模式是短路，可能起火，是最不能省余量的品类。
      - key: capacitance
        unit: F
        cmp: value_equal
        conf: S
      - key: esr
        unit: ohm
        cmp: lte
        conf: D
        note: "ESR 高的钽在纹波下发热；聚合物钽 ESR 低一个数量级"
      - key: case_size
        unit: null
        cmp: enum_equal
        conf: S
        note: "CASE-A/B/C/D 与 3216/3528/6032/7343 焊盘不同"
    conditional_critical:
      - when: "上电浪涌/热插拔/低阻抗电源"
        keys: [voltage_rating]
        tighten: "降额到 3x 或用聚合物钽/固态铝；普通钽在低阻源下易击穿"
        conf: E
    relaxable:
      - {key: brand, note: "国产（湘怡中元等）vs AVX/Kemet 价差约 1.7x（10uF/16V CASE-A：0.9633 vs 0.5567）"}
      - {key: tolerance, note: "±20% 常见，不必强求 ±10%"}
    upgrade_rules:
      - {id: t_poly, when: "低 ESR/高可靠要求", do: "普通钽 -> 聚合物钽（POSCAP）", cost: "2~4x"}
      - {id: t_volt_up, when: "浪涌风险", do: "升耐压到 3x", cost: "1.3~2x、体积增大"}
    forbid_rules:
      - "严禁电压降额不足 2x"
      - "严禁在低阻抗电源上直接用普通钽替代低 ESR 聚合物钽"
      - "极性反接必失效；替代时确认 CASE 极性标记"
    price_band:
      ref: "10uF/16V CASE-A"
      tiers_rmb: [{qty: 20, price: 0.9633}, {qty: 60, price: 0.843}, {qty: 200, price: 0.7356}]
      budget_alt: "国产 50 起 0.5567 / 500 起 0.4891"
      conf: M
    default_parts:
      - {mpn: "TAJA106K016RNJ", brand: "Kyocera AVX", code: "C7171", spec: "10uF ±10% 16V ESR 3Ω@100kHz CASE-A", note: "国际品牌基准"}
      - {mpn: "CA45-A016K106T", brand: "湘怡中元/湘江", code: "C119051", spec: "10uF ±10% 16V ESR 3Ω CASE-A", note: "国产替代，价格约 60%"}
    risk_notes:
      - "翻新/散新：钽电容拆机后打磨重印极常见，标识易被磨掉（CASE 上只有一条极性带）"
      - "电压虚标：低价品标 16V 实为 10V，浪涌下直接短路冒烟"
      - "识别：正常钽表面平整无划痕；打磨痕迹呈雾状；批次一致性差"

  inductor:
    display: 电感（功率电感/贴片电感）
    lcsc_category: [贴片电感, 功率电感, 一体成型电感]
    mall_params_observed: [电感值, 精度, 额定电流, 饱和电流(Isat), 直流电阻(DCR)]
    mall_filter_extra: [封装/尺寸, 品牌, 屏蔽形式]
    required_to_specify: [inductance, isat, dc_resistance, rated_current, size]
    substitute_equivalence: "电感值相同 + Isat>= + DCR<= + 尺寸可装 = 可替换（屏蔽性需确认）"
    critical:
      - key: inductance
        unit: H
        cmp: value_equal_tol
        conf: S
        note: "等值；DCDC 中电感值变化会改纹波与稳定性，±20% 内可接受，需复核环路"
      - key: isat
        unit: A
        cmp: gte_margin
        margin: 1.3
        conf: E
        note: |
          Isat 是"电感量下降 20~30%"的电流，不是烧毁电流。
          Buck 中峰值电流 = Iout + ΔIL/2，Isat 必须 >= 1.3x 该峰值。
      - key: dc_resistance
        unit: ohm
        cmp: lte
        conf: D
        note: "DCR 直接决定铜损 I^2R；大电流场合 DCR 升高=过热"
      - key: rated_current
        unit: A
        cmp: gte_margin
        margin: 1.2
        conf: E
        note: "额定电流（温升 40K 定义）与 Isat 是两回事，必须都满足"
      - key: size
        unit: null
        cmp: enum_compatible
        conf: S
    conditional_critical:
      - when: "DCDC 功率回路"
        keys: [isat, dc_resistance, 屏蔽]
        tighten: "优先一体成型/屏蔽式（漏磁小），计算温升"
        conf: E
      - when: "EMC 敏感 / 靠近信号线"
        keys: [屏蔽]
        tighten: "必须屏蔽式"
        conf: E
    relaxable:
      - {key: brand, note: "国产 vs 日系 1.2~2x"}
      - {key: tolerance, note: "±20% 可接受（部分料 ±10% 更贵但没必要）"}
      - {key: 封装, note: "空间允许时更大封装 DCR 更低、更便宜"}
    upgrade_rules:
      - {id: l_isat_up, when: "峰值电流接近 Isat", do: "升尺寸或升 Isat 型号", cost: "体积/价格"}
      - {id: l_shield, when: "EMI 整改", do: "绕线 -> 一体成型屏蔽", cost: "1.2~2x"}
    forbid_rules:
      - "严禁只看额定电流不看 Isat（很多低价料额定电流标得很好看，Isat 却很低）"
      - "严禁用非屏蔽电感替代屏蔽电感用于高密度板"
      - "严禁在谐振/滤波场合用电感值偏差大的料（会偏频）"
    price_band:
      ref: "CD32 10uH 贴片功率电感"
      tiers_rmb: [{qty: 10, price: 0.2713}, {qty: 100, price: 0.2185}, {qty: 300, price: 0.1921}]
      budget_alt: "20 起 0.180405 / 600 起 0.11837（Isat 950mA, DCR 286mΩ）"
      conf: M
    default_parts:
      - {mpn: "CD32YP0302-100M", brand: "YJYCOIN(益嘉源)", code: "C492261", spec: "10uH ±20% 1A DCR 342mΩ", note: "常规小功率"}
      - {mpn: "MSCD32-100KT", brand: "MetalLions(美铼)", code: "C915150", spec: "10uH ±10% Isat 950mA DCR 286mΩ", note: "参数更全、更便宜"}
    risk_notes:
      - "参数虚标：低价功率电感 Isat 虚标最严重（标 3A 实际 1.5A 就软饱和）。大电流设计必须实测或选大厂"
      - "DCR 虚标：小厂 DCR 常比标称高 30%~100%，铜损翻倍"
      - "翻新：拆机电感脚上有锡、漆包线发黑"
      - "识别：正规品有清晰的感值/公差印字；一体成型看压制密度与电极镀层"

  ferrite_bead:
    display: 磁珠
    lcsc_category: [磁珠]
    mall_params_observed: [阻抗@频率, 误差, 直流电阻(DCR), 额定电流]
    mall_filter_extra: [封装, 品牌]
    required_to_specify: [impedance_at_100mhz, rated_current, dc_resistance, size]
    substitute_equivalence: "阻抗@100MHz 相同量级 + 额定电流>= + 尺寸相同 = 可替换"
    critical:
      - key: impedance_at_100mhz
        unit: ohm
        cmp: gte_margin
        margin: 1.0
        conf: D
        note: "磁珠靠阻抗吸收高频噪声；阻抗不足=滤波失效。注意阻抗曲线，不只看 100MHz 点"
      - key: rated_current
        unit: A
        cmp: gte_margin
        margin: 1.3
        conf: E
        note: "超过额定电流后磁珠饱和，阻抗骤降，同时 DCR 发热"
      - key: dc_resistance
        unit: ohm
        cmp: lte
        conf: E
        note: "电源线上磁珠 DCR 引起压降，大电流时要注意（如 2A x 50mΩ = 0.1V）"
      - key: size
        unit: null
        cmp: enum_equal
        conf: S
    conditional_critical:
      - when: "信号线（USB/差分/时钟）"
        keys: [阻抗@频率, 阻抗曲线]
        tighten: "需查曲线在高频段（数百 MHz~GHz）仍有阻抗；大电流磁珠不适合信号线"
