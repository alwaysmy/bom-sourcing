    relaxable:
      - {key: brand, note: "村田/TDK vs 国产 1.5~2x"}
      - {key: 误差, note: "±25% 是常态，不必苛求"}
    upgrade_rules:
      - {id: b_imp_up, when: "EMI 超限", do: "升阻抗等级或改共模电感", cost: "1~2x"}
    forbid_rules:
      - "严禁用磁珠替代 0Ω 电阻用于大电流通路（DCR + 饱和）"
      - "严禁在需要直流通过的电源线上用高阻抗磁珠而不核算压降"
      - "磁珠不能替代去耦电容，两者作用不同"
    price_band:
      ref: "0603 磁珠 120Ω@100MHz 2A"
      tiers_rmb: [{qty: 50, price: 0.0834}, {qty: 500, price: 0.0637}, {qty: 1500, price: 0.0549}]
      ref2: "220Ω@100MHz 2.2A"
      tiers2_rmb: [{qty: 10, price: 0.1233}, {qty: 100, price: 0.0965}]
      conf: M
    default_parts:
      - {mpn: "BLM18PG121SN1D", brand: "muRata(村田)", code: "C14709", spec: "0603 120Ω@100MHz ±25% DCR 50mΩ 2A", note: "电源线通用"}
      - {mpn: "MPZ1608S221ATA00", brand: "TDK", code: "C76815", spec: "0603 220Ω@100MHz ±25% 2.2A", note: "信号线/低频段"}
    risk_notes:
      - "假磁珠：实为 0Ω 电阻或普通电感，阻抗几乎为零。识别：拿万用表量直流电阻（应在几十 mΩ）、或用阻抗分析仪"
      - "阻抗虚标：低频段阻抗虚高，高频段没有。要求提供阻抗-频率曲线"
      - "翻新：拆机磁珠镀层发暗、端头有锡"

  # ------------------------------------------------------------ 分立器件 ----
  diode_rectifier:
    display: 整流二极管
    lcsc_category: [通用二极管, 整流桥]
    mall_params_observed: [二极管配置, 正向压降(Vf), 直流反向耐压(Vr), 整流电流]
    mall_filter_extra: [封装, 品牌, 恢复时间]
    required_to_specify: [vr, if_avg, package, vf]
    substitute_equivalence: "Vr>= + If>= + 封装相同 + 恢复时间不劣 = 可替换"
    critical:
      - key: vr
        unit: V
        cmp: gte_margin
        margin: 1.5
        conf: E
        note: "反向耐压 >= 1.5x 最高反向电压（含振铃尖峰，感性负载取 2x）"
      - key: if_avg
        unit: A
        cmp: gte_margin
        margin: 1.5
        conf: E
        note: "平均整流电流；注意正弦整流时 If_avg 与实际负载电流的关系，峰值电流另算"
      - key: vf
        unit: V
        cmp: lte
        conf: D
        note: "正向压降决定损耗 P=Vf*If；低压输出场合差异显著"
      - key: package
        unit: null
        cmp: enum_compatible
        conf: S
      - key: trr
        unit: s
        cmp: lte
        conf: D
        note: "高频整流/开关电源必须用快恢复；工频整流可用慢恢复（更便宜）"
