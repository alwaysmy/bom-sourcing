# =============================================================================
# spec-rules.yaml — 元器件"指标对比 + 替代判定"机读规则库
# 用途：BOM 配单/采购时，在指标允许范围内筛选可用料，再按价格/可得性排序。
# 配套人读版：research/spec-rules.md（同一套规则的解释、推导与坑）
# =============================================================================
schema: bom-spec-rules
version: 1
generated: "2026-11-04"
locale: zh-CN

# -----------------------------------------------------------------------------
# 0. 来源与可信度（每条规则/数值都带 conf 标记，程序可按 conf 做降级处理）
# -----------------------------------------------------------------------------
sources:
  price:
    name: 立创商城 szlcsc.com 自营现货价（含税）
    method: 真人浏览器读取搜索结果页商品行，未调用任何第三方接口
    sampled: "2026-11-04"
    tiers_used: [100, 1000, 5000]     # 采样档位；实际下单价随数量阶梯变化
    caveat: "价格为当日快照，仅作量级参考，采购前必须实测；不含运费/加工费/最小包装摊薄"
  mall_params:
    name: 立创商城商品行参数（可筛维度的实测依据）
    method: 逐关键词抓取搜索结果前 N 行，记录每类目实际暴露的参数键
    sampled: "2026-11-04"
    caveat: "商品行参数是筛选面板的子集；筛选面板可能还有更多维度（待接口确认）"
  standards:
    - "IEC 60384-1 / -21 / -22（固定电容器通用、MLCC、电解）"
    - "IEC 60115（固定电阻器）"
    - "IEC 61000-4-5（浪涌，TVS 选型依据的测试波形 8/20us、10/1000us）"
    - "JEDEC JESD22 / AEC-Q200（车规降额依据）"
  datasheets:
    - "Murata: Voltage characteristics of electrostatic capacitance（MLCC 直流偏压容值衰减）"
    - "TDK: 电解电容器寿命 10℃2 倍定律（Arrhenius）"
    - "TI/ADI/ST/onsemi 通用数据手册（器件 VM 示意图与极限参数）"

confidence:
  S:
    label: 标准/手册规定
    use: 可直接作为硬判据
  D:
    label: 厂家数据手册
    use: 可直接作为硬判据（需注意测试条件）
  M:
    label: 商城实测（价格/库存/参数键）
    use: 参考量级，会漂移
  E:
    label: 工程经验值
    use: 作为默认余量/阈值，可被项目实测覆盖；使用时必须在报告里标 E

# -----------------------------------------------------------------------------
# 1. 全局降额与余量（默认策略；单品类可覆盖）
# -----------------------------------------------------------------------------
globals:
  voltage_derating:
    ceramic_mlcc_class2: 2.0      # X5R/X7R/Y5V 等 II 类：额定电压 >= 2x 工作电压（DC bias 衰减）
    ceramic_mlcc_class1: 1.5      # C0G/NP0：>= 1.5x
    electrolytic: 1.5             # 铝电解：>= 1.5x（含纹波峰值）
    tantalum: 2.5                 # 钽电容：>= 2.5x（且必须 50% 以上电流降额，见品类）
    film: 1.5
    mosfet_vds: 1.5               # 常规；有感性尖峰时 2.0
    diode_vr: 1.5
    bjt_vceo: 1.5
    ldo_vin: 1.2                  # 输入电压上限留 20%
    conf: E
  current_derating:
    continuous_vs_rated: 2.0      # 长期连续电流 <= 0.5 额定
    peak_vs_rated: 1.3            # 峰值 <= 额定/1.3
    inductor_isat: 1.3            # Isat >= 1.3x 峰值电流
    fuse_hold: 1.5                # 工作电流 <= 0.67 x Ihold
    conf: E
  power_derating:
    resistor: 2.0                 # 额定功率 >= 2x 实际耗散
    mosfet: 2.0                   # Pd 降额 50%
    bjt: 2.0
    conf: E
  thermal:
    tj_margin: 0.8                # 结温 <= 0.8 x Tj(max)
    electrolytic_life_rule: "每降 10℃ 寿命翻倍（Arrhenius）"
    conf: S
  temperature_grade:
    commercial: "0~70℃"
    industrial: "-40~85℃"
    extended: "-40~105℃"
    automotive: "-40~125℃ (AEC-Q100/Q200)"
    policy: "民用室温场景可放宽到 commercial；户外/工业必须 industrial 以上"
    conf: E
  preferred_values:
    resistors: ["E24 优先，精密用 E96"]
    capacitors: ["E6/E12（1.0 1.5 2.2 3.3 4.7 6.8 及其十倍）"]
    conf: S
  packaging_rules:
    items:
      - "SMT 优先 0603/0805 通用封装；0402 仅在高密度板且贴装能力具备时用"
      - "同容值/同耐压优先选更小封装中价格更低者，但注意电压/电流能力随封装下降"
      - "优先选 5000 个/圆盘等整盘包装；小批量走拆盘或管装会增加单价"
    conf: E

# -----------------------------------------------------------------------------
# 2. 封装能力速查（跨品类；用于"能否换封装"以及功率/电流估算）
# -----------------------------------------------------------------------------
package_capability:
  resistor:
    "0201": {max_power: "50mW",  typical_current: "0.1A"}
    "0402": {max_power: "63mW",  typical_current: "0.15A"}
    "0603": {max_power: "100mW", typical_current: "0.25A"}
    "0805": {max_power: "125mW", typical_current: "0.4A"}
    "1206": {max_power: "250mW", typical_current: "0.6A"}
    "1210": {max_power: "330mW", typical_current: "0.8A"}
    "2010": {max_power: "500mW", typical_current: "1.0A"}
    "2512": {max_power: "1W",    typical_current: "1.5A"}
    conf: D
    note: "以上为常见常规品上限，具体以厂家 datasheet 为准；大电流需合金/金属膜采样电阻"
  mlcc_voltage_by_size:
    "0402": "6.3~50V 常见"
    "0603": "6.3~100V 常见"
    "0805": "6.3~100V，10uF 通常在 25V 以下"
    "1206": "6.3~200V"
    "1210": "16~200V，22uF 常见"
    conf: M
  thermal_resistance:
    "SOT-23": "~350~500℃/W"
    "SOT-223": "~60~100℃/W"
    "SOP-8": "~120~160℃/W"
    "TO-252(DPAK)": "~40~60℃/W"
    "DFN3x3": "~40~60℃/W（依赖 PCB 铜箔）"
    conf: E
  note: "Rθja 强依赖 PCB 铜面积，数据手册值多为 JEDEC 标准板；实际样品必须实测温升"

# -----------------------------------------------------------------------------
# 3. 筛选+打分算法（可直接照做的伪流程）
# -----------------------------------------------------------------------------
algorithm:
  name: hard_filter_then_margin_then_price_rank
  principle: "指标先定可用集合（集合外一律不参与比价），再在集合内按价格与可得性排序"
  steps:
    - id: S0_normalize
      do: |
        把 BOM 行规整为 requirement 结构：
        {family, mpn?, params{}, qty, refdes[], board?, env?}
        params 的键统一到本文件的 key（欧姆/法拉/伏/安/瓦/摄氏度/赫兹）
      input_failure: "型号未知且必配参数不全 -> 转 S0b 反向选型"
    - id: S0b_reverse_select
      when: "只有功能描述，没有型号"
      do: "用品类 default_parts 作为种子 -> 取参数区间 -> 走 S2 之后的正常流程"
    - id: S1_family_resolve
      do: |
        型号已知：用 lcsc_category / mall_params 反推 family；
        型号未知：人工（或 LLM）按功能关键词映射到 family。
      guard: "family 判错会让后续所有规则失效 -> family 不确定时强制人工确认"
    - id: S2_hard_filter
      filters:
        - category_match        # 类目必须同族
        - package_capability    # 封装必须兼容（同封装或更大且允许改板）
        - critical_all_pass     # critical 清单逐项判定，任一 fail -> 淘汰
        - lifecycle             # 停售/EOL/无库存 -> 淘汰或降权
        - env_grade             # 温度等级不得低于项目要求
      output: candidates_A（硬约束可用集）
    - id: S3_margin_check
      do: |
        对 deviations=gte/gte_margin 的参数套用 margin 系数：
        pass 条件 = 候选额定值 / 需求实际值 >= margin
        margin 缺失时用 globals 默认；任何一项不过 -> 淘汰并写 reason
      output: candidates_B（含余量校验通过的可用集）
    - id: S4_price_normalize
      do: |
        按需求数量命中阶梯价；计算 landed_unit_price =
          阶梯单价 + 最小包装摊薄惩罚 + 运费分摊（若可算）
        最小包装惩罚：qty < 包装数量时，等效单价 = 阶梯价 * 包装数 / qty
        同一 MPN 多个 C 编号 -> 按 C 编号去重后取有货且最低价者
    - id: S5_score
      formula: |
        score = w_price    * (1 - norm(landed_unit_price))
              + w_stock    * stock_term
              + w_hot      * hot_term
              + w_supply   * multisupplier_term
              - w_risk     * risk_penalty
        stock_term      = clamp(log10(stock_qty)/6, 0, 1)     # 1KK+ 记 1.0
        hot_term        = 有"近期成交100+单"/爆款标记? 1 : 0.5
        multisupplier   = 该 MPN 在售品牌数>=2 ? 1 : 0.6
        risk_penalty    = 风险标记数 * 0.15（涂标/散新/无数据手册/停售）
      weights: {w_price: 0.50, w_stock: 0.20, w_hot: 0.12, w_supply: 0.08, w_risk: 0.10}
    - id: S6_output
      do: |
        输出 topN（默认 3）+ 每项：
          - rank / landed_unit_price / stock / 品牌 / C 编号
          - reasons[]：为什么可用（逐条 critical 通过、余量倍数）
          - diff{}：与原始料的逐项参数对比（含"更优/相同/更差"标注）
          - flags[]：需人工确认项（未找到的参数、条件不一致、包装不符）
      rule: "若 candidates_B 为空，禁止自动降价替代；必须回退到'原型号 + 更贵渠道'或人工确认"
  scoring_guards:
    - "价格权重不得超过 0.6：避免为了省几分钱选到不可靠渠道"
    - "critical 参数不参与打分，只参与过滤：不容许'指标略差但很便宜'进入候选"
    - "同 family 内跨封装比较必须计入改板成本，不能只比料价"
  tie_breaks:
    - "库存多者优先"
    - "有数据手册者优先"
    - "已在大货验证过的品牌优先（board history）"
    - "封装更通用者优先（0603/0805 > 0402/0201）"

# =============================================================================
# 4. 品类规则
#    每个 family 的字段含义：
#      lcsc_category        商城类目（用于反推 family）
#      mall_params_observed 商城商品行实际暴露的参数键（M，实测）
#      mall_filter_extra    筛选面板补充维度（M）
#      required_to_specify  做替代判定"最少"要给的参数（缺则必须反问）
#      substitute_equivalence  同族等价判定（全部满足=可直接替换，品牌无关）
#      critical             硬约束（不满足即不可用，不参与打分）
#      conditional_critical 场景相关的收紧项
#      relaxable            可放宽（用于换价格）
#      upgrade_rules        可升级替代
#      forbid_rules         绝对不可替代的情形
#      price_band           实测价格带（M）
#      default_parts        默认型号库（无型号时反向选型的种子）
#      risk_notes           淘宝/散新常见坑与识别法
# =============================================================================
families:

  # ---------------------------------------------------------------- 无源 ----
  resistor:
    display: 电阻
    lcsc_category: [贴片电阻, 插件电阻, 排阻, 电流采样电阻/分流器]
    mall_params_observed: [电阻类型, 阻值, 精度, 功率]
    mall_filter_extra: [封装, 温度系数, 品牌, 包装, 认证信息]
    required_to_specify: [resistance, package, tolerance, power_rating]
    substitute_equivalence: "阻值等值 + 封装相同 + 功率>=原值 + 精度<=原值 = 可直接替换（品牌无关）"
    critical:
      - key: resistance
        unit: ohm
        cmp: value_equal
        conf: S
        note: "必须等值；E24/E96 就近舍入只能在明确告知后由人确认"
      - key: package
        unit: null
        cmp: enum_equal_or_larger
        conf: S
        note: "同封装=免改板；更大封装需确认焊盘"
      - key: power_rating
        unit: W
        cmp: gte_margin
        margin: 2.0
        conf: E
        note: "额定功率 >= 2x 实际耗散（P=I^2*R）"
      - key: tolerance
        unit: percent
        cmp: lte
        conf: D
        note: "候选精度必须不劣于原料；分压/反馈/基准回路<=0.5~1%"
    conditional_critical:
      - when: "精密分压 / 基准 / 电流检测"
        keys: [tempco, tolerance, 电阻类型]
        tighten: "tempco<=100ppm/℃（精密<=50）；tolerance<=0.5%；优先薄膜/合金而非厚膜"
        conf: E
      - when: "阻值 < 1Ω 或 采样电阻"
        keys: [tempco, 电阻类型, power_rating]
        tighten: "必须合金/金属膜（低 TCR，<=50ppm/℃），厚膜严禁用于分流"
        conf: E
      - when: "上拉/下拉/限流/RC 滤波（非精密）"
        keys: [tolerance]
        relax: "可放宽到 ±5%，甚至 ±10%（注意时序/电流波动）"
        conf: E
    relaxable:
      - {key: brand, note: "同阻值同封装不同品牌价差可达 2~3x（实测 0805 1% 10k：0.0202 vs 0.013992）"}
      - {key: packaging, note: "整盘 vs 拆盘，影响单价不影响功能"}
      - {key: tolerance, note: "非精密场合 5% 可替 1%"}
      - {key: 温度等级, note: "民用可 70℃ 级"}
      - {key: tempco, note: "无温漂要求时可无视 100ppm 与 200ppm 的差别"}
    upgrade_rules:
      - {id: r_power_up, when: "实际耗散 > 50% 额定", do: "升一档封装（0805->1206）或换高功率系列", cost: "料价/占板面积增加"}
      - {id: r_precision_up, when: "批量一致性差/温漂致漂移", do: "厚膜 -> 薄膜 0.1% 25ppm", cost: "5~20x 料价"}
      - {id: r_free_upgrade, when: "更高功率/更高精度料恰好更便宜（国产替代）", do: "直接换，属免费升级", conf: E}
    forbid_rules:
      - "严禁用小功率电阻替代大功率（封装功率上限见 package_capability）"
      - "严禁把厚膜电阻用于电流采样（TCR 大、噪声大）"
      - "保险/熔断用途不得用普通电阻替代（无熔断特性，起不到保护）"
      - "高压（>200V）回路不得跨封装降级，需查 datasheet 工作电压上限（常低于功率上限）"
    price_band:
      ref: "0805 1% 10kΩ 厚膜"
      tiers_rmb: [{qty: 100, price: 0.0202}, {qty: 1000, price: 0.0154}, {qty: 5000, price: 0.0108}, {qty: 50000, price: 0.0085}]
      budget_alt: "国产同规格 100 起 0.013992 / 5000 起 0.008712"
      conf: M
    default_parts:
      - {mpn: "0805W8F1002T5E", brand: "UNI-ROYAL(厚声)", code: "C17414", spec: "0805 10kΩ ±1% 125mW", note: "通用基础库，供货最稳"}
      - {mpn: "FRC0805F1002TS", brand: "FOJAN(富捷)", code: "C2907219", spec: "0805 10kΩ ±1% 125mW", note: "同规格更便宜，SMT 扩展库"}
    risk_notes:
      - "散新/翻新：电阻本体无丝印，最易被换料；靠 X-Ray 或阻值抽检难辨。选立创自营/有数据手册/近期成交多的行"
      - "功率虚标：小厂 0805 标 250mW 实为 125mW 工艺；高功耗场合必须留 2x 余量"
      - "阻值漂移：低价厚膜在高湿环境阻值漂移可达 1% 以上（硫化），含硫环境要用抗硫化系列"

  capacitor_mlcc:
    display: 陶瓷电容（MLCC）
    lcsc_category: [贴片电容(MLCC), 直插独石电容(MLCC)]
    mall_params_observed: [容值, 精度, 额定电压, 温度系数]
    mall_filter_extra: [封装, 品牌, 包装]
    required_to_specify: [capacitance, voltage_rating, dielectric, package, tolerance]
    substitute_equivalence: "容值 + 耐压>= + 介质温度特性不劣 + 封装相同 = 可直接替换"
    critical:
      - key: capacitance
        unit: F
        cmp: value_equal
        conf: S
        note: "等值；去耦可按 -50%/+100% 放宽，定时/滤波/谐振回路必须等值"
      - key: voltage_rating
        unit: V
        cmp: gte_margin
        margin: 2.0
        conf: S
        note: |
          II 类介质（X5R/X7R/Y5V）在额定电压下容值可掉 35~65%（EPCI 实测），
          实测案例：1uF/6.3V X5R 加 3V DC 后仅剩 0.36uF（-64%）。
          故 II 类必须 2x 降额；I 类（C0G/NP0）可用 1.5x。
      - key: dielectric
        unit: null
        cmp: enum_order
        order: ["C0G/NP0", "X7R", "X5R", "X6S", "Y5V", "Z5U"]
        conf: S
        note: "顺序=温度稳定性从好到差。只能同级或更好；Y5V/Z5U 不得替 X7R"
      - key: package
        unit: null
        cmp: enum_equal
        conf: S
        note: "同容值同耐压时封装越大越贵；但小封装大容值 DC bias 衰减更严重"
      - key: tolerance
        unit: percent
        cmp: lte
        conf: D
        note: "定时/谐振用 C0G ±5%（甚至 ±1%/±0.5%）；去耦 ±10~20% 均可"
    conditional_critical:
      - when: "定时 / 谐振 / 采样保持 / 高 Q 滤波"
        keys: [dielectric, tolerance, tempco]
        tighten: "必须 C0G(NP0)；容差 ±5% 或更好；不得用 II 类"
        conf: S
      - when: "开关电源输入/输出滤波"
        keys: [额定纹波电流, ESR]
        tighten: "查 datasheet 的允许纹波（MLCC 通常足够，但仍要核算温升）"
        conf: E
      - when: "高压（>100V）"
        keys: [voltage_rating, 封装]
        tighten: "注意 MLCC 高压型的容值-电压曲线与开裂风险，需 2x 以上且避开 1206 以上大尺寸急冷"
        conf: E
    relaxable:
      - {key: brand, note: "同规格国产 vs 日系价差 1.5~2.5x（10uF/25V/0805：0.2574 vs 0.194275）"}
      - {key: tolerance, note: "去耦场合 ±20% 无损"}
      - {key: dielectric, note: "去耦允许 X5R 替 X7R（温漂范围小差异）"}
      - {key: packaging, note: "无影响"}
    upgrade_rules:
      - {id: c_volt_up, when: "DC bias 导致有效容值不足", do: "升耐压（6.3V->16V/25V）或升封装（0603->0805）", cost: "料价/面积"}
      - {id: c_diel_up, when: "温漂/容量稳定性要求高", do: "X7R -> C0G", cost: "同容值下体积大 3~10 倍、价格 3~10 倍"}
      - {id: c_parallel, when: "单颗容值/ESR 不够", do: "多颗并联（同时降低 ESL/ESR）", cost: "贴装点数"}
    forbid_rules:
      - "Y5V/Z5U 严禁用于任何有稳定性要求的场合（-80% 容值 + 强 DC bias）"
