# =============================================================================
# 厂商 / 品牌可信度表 —— 选料时的「品牌分层」知识库（机读版）
#
# 用途：同一型号在立创上常挂着十几个品牌的 C 号（AMS1117-3.3 有 18 个、SS34 有 17 个、
#       S8050 有 24 个），价差可达 5~20 倍。只按价格排序会把贸易商/散货品牌当原厂推荐，
#       量产时批次一致性、参数一致性、可追溯性都没有保障。本表给出「品牌 → 信任层级」，
#       供 pick.py / bom.py 在「同规格候选中如何排序」这一步使用。
#
# 用法：
#   1) tier_policy.hard_filters  先做硬过滤（tier 不允许的场合直接剔除）
#   2) tier_policy.score_bonus   再给通过过滤的候选加分
#   3) 品牌只是「同等规格下」的排序因子，不能替代指标核对（指标核对见 data/spec-rules.yaml）
#
# 人读版：references/vendors.md（含维护流程 / 复核周期 / 取证方法）
# 采集记录：Bom_Flow/research/vendors.md（本次实测的 25 个关键词、645 条记录）
#
# 维护约定：
#   1. 品牌名一律原样使用立创 productGradePlateName（含中文括号），不得自造或改写
#   2. tier 判定必须有可观证据（官网 / 是否自有产线 / 是否横跨不相关品类 / 价格档位），
#      证据不足的写 evidence: experience + confidence: low
#   3. 价格与库存是瞬时快照，必须标采集时间
#   4. 本表只做「可信度分层」，不做「好/坏」评价：贸易商在打样阶段是合理选择
# =============================================================================

schema: bom-sourcing/knowledge/vendors
version: 1
generated: '2026-11-05'
locale: zh-CN

purpose: >-
  把「这个品牌能不能用、用在什么场合」从拍脑袋变成可匹配的层级表。
  同一颗料在原厂与贸易商之间的价差是真实的，但量产风险也是真实的；
  本表提供的是「按场合选择信任层级」的判据，而不是一张黑名单。

evidence_levels:
  official: 品牌官网 / 官方产品目录 / 授权代理名录，可作硬约束
  measured: 本仓 probe/vendors/ 脚本实测（品牌名、价格、库存、型号），可作硬约束
  secondary: 第三方转述（行业媒体、论坛、分销商页面），只作提示
  experience: 行业通行经验，无单一出处，只作启发式，必须可被人工推翻

# -----------------------------------------------------------------------------
# 一、分层定义
# -----------------------------------------------------------------------------
tiers:
  original_idm:
    display: 原厂 IDM
    definition: 自有晶圆/封测产线的原厂，或自有品牌的全流程制造商（含阻容感、连接器、继电器等无源件龙头）
    examples: [TI(德州仪器), ST(意法半导体), muRata(村田), YAGEO(国巨), FH(风华), 松乐]
    price_index: 1.0            # 相对基准
    risk: 假货/翻新为主要风险（非品牌本身问题），须走正规渠道
    default_for: 量产、认证、可靠性敏感场合
  original_fabless:
    display: 原厂 Fabless
    definition: 无自有晶圆厂但自有设计、自有型号与品牌（国产 MCU/电源/运放为主）
    examples: [WCH(南京沁恒), GigaDevice(兆易创新), 3PEAK(思瑞浦), 西安航天民芯, AOS]
    price_index: 0.9
    risk: 兼容型号需重测固件/时序；原厂型号本身无问题
    default_for: 国产替代、成本敏感但要求原厂料号可追溯
  domestic_second:
    display: 国产二线 / 替代品牌
    definition: 有自有型号体系与官网的二线/替代品牌，多为 pin-to-pin 兼容件
    examples: [UMW(友台半导体), HGSEMI(华冠), MDD(辰达半导体), HRE(芯声), HKT(合科泰)]
    price_index: 0.3            # 相对原厂
    risk: 关键参数（温漂、PSRR、CTR 分档、Rds(on) 测试条件）标注不全或偏乐观，须抽样实测
    default_for: 打样、小批量、非关键参数场合；量产须做批次一致性验证
  trader:
    display: 贸易商 / 贴牌散货
    definition: 无自有产线、无自有型号体系的贴牌/散货品牌；机械特征是同一品牌横跨大量不相关品类
    examples: [JSMSEMI(杰盛微), GOODWORK(固得沃克), R+O(宏嘉诚), FOSAN(富捷/富信), 国芯佳品]
    price_index: 0.15
    risk: 批次不一致、参数虚标、丝印打磨、无原厂授权；出问题无法追溯
    default_for: 仅打样/验证阶段的非关键件；量产默认剔除
  unknown:
    display: 未判定 / 无牌
    definition: 无官网、无中文名、或本次采集资料不足以判定的品牌
    examples_note: 由脚本自动回填（本次采集里未能判定归属的品牌）
    price_index: null
    risk: 最高。可能对应同一批散货换多个丝印
    default_for: 不建议使用；若必须用，先做全参数抽测

# -----------------------------------------------------------------------------
# 二、可执行策略（pick.py / bom.py 直接照做）
# -----------------------------------------------------------------------------
tier_policy:
  description: >-
    品牌分层是「同等规格、同等封装、同等库存」之后的排序因子，不参与硬过滤以外的任何
    指标判断。硬过滤只按使用场合（stage）决定允许的 tier 集合。

  stage_allowed_tiers:
    prototype:            # 打样：功能优先，成本敏感，允许贸易商
      allow: [original_idm, original_fabless, domestic_second, trader]
      note: trader 允许但必须提示「量产需换料」
    small_batch:          # 小批（<100 片）：开始看一致性
      allow: [original_idm, original_fabless, domestic_second]
    mass_production:      # 量产：可追溯性优先
      allow: [original_idm, original_fabless]
      note: 只有 datasheet 明确给出 pin-to-pin 兼容且原厂料号时，才允许 domestic_second
    certified:            # 认证/医疗/车载
      allow: [original_idm, original_fabless]
      require_official_datasheet: true
      forbid_tier_override: true   # 即使价格再低也不降级

  score_bonus:
    original_idm: 1.00
    original_fabless: 0.90
    domestic_second: 0.45
    trader: 0.10
    unknown: 0.00
    formula: 'brand_score = score_bonus[tier] * 0.15  # 权重 15%，与 spec-rules.yaml 的 brand_score 对齐'

  hard_rules:
    - id: no_unknown_in_mass
      rule: 'stage in {mass_production, certified} 且 tier == unknown → 直接剔除'
      rationale: 无牌散货无法做批次追溯，量产返修成本远高于料价差
    - id: trader_needs_flag
      rule: 'stage == prototype 且 tier == trader → 允许，但输出必须带 warning: "贸易商品牌，量产需换原厂/二线料号"'
      rationale: 打样阶段用贸易商是合理的，但必须让人知道
    - id: name_collision_check
      rule: '品牌中文名或英文缩写与其它品牌同名的，采购单必须写完整 productGradePlateName'
      rationale: FOSAN(富捷/富信) vs FOJAN(富捷)、RS(容硕) vs RS Components、HUAWEI(华威集团) vs 华为、JBL(金比莱) vs JBL 音响
    - id: tier_never_overrides_spec
      rule: 'tier 只用于同规格候选的排序；不得因为 tier 高而放宽 spec-rules.yaml 的硬约束'
      rationale: 原厂的错料依然是错料

  dedup_rule:
    rule: '同一 tier 内优先按「库存 > 0 且销量高」选；同 MPN 多个 C 号时按 C 号去重后取有货者'
    rationale: W25Q64JVSSIQ 的 C179171 有货 1383、C83140 库存 0，同型号不同 C 号库存完全独立

