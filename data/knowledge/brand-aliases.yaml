# 立创品牌 facet 的归并与歧义登记
#
# 为什么需要：立创按"品牌"枚举 facet（`gradePlateGroup`），同一家公司可能被拆成两条
# （带不带中文、带不带被收购品牌），也可能把两家不同公司塞进一条（用 `/` 连接）。
# 这张表是**人工复核过**的结论，`brands.py` 应用后写入 `brands.index.yaml` 的
# `merge_into` / `ambiguous` 字段；**不做运行时自动推断**（同名不同司的风险太高，
# 例如 ST(意法半导体) vs ST(先科)、FOSAN(富捷) vs FOJAN(富捷)）。
#
# 维护约定：
#   - 只有"确认同一法人/同一集团（含并购）"才写进 merges；
#   - 一条 facet 名里塞了两家不同公司的，写进 ambiguous，**不归并**；
#   - 每条都要写 reason，能追溯到并购公告或官方命名。

